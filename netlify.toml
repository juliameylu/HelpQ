[build]
  base = "front-end"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: all routes served by index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Proxy /api and /health to the backend (set VITE_API_URL for deployed builds
# instead — this proxy only applies to Netlify Dev previews)
# [[redirects]]
#   from = "/api/*"
#   to = "https://helpq-backend.onrender.com/api/:splat"
#   status = 200
#   force = true
