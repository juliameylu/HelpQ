services:
  - type: web
    name: helpq-backend
    runtime: node
    rootDir: packages/express-backend
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SCHEDULE_TIMEZONE
        value: America/Los_Angeles
    healthCheckPath: /health
